<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Stock Status</title>
  <style>
    body {
      background-color: #f3f5fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #dde0ee;
      border-top-color: #1e2d6b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbzOVjtEYRzg2bUg4c6L-6pdpOsOaUSSmqB98CO6s91Y1PVynSD38MI0Ji2vodYB04kg7g/exec";
    fetch(GAS_URL + "?action=getUiHtml")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.html) {
          document.open();
          document.write(data.html);
          document.close();
        } else {
          document.body.innerHTML = "<p style='color:red;'>Failed to load application interface.</p>";
        }
      })
      .catch(function(err) {
        document.body.innerHTML = "<p style='color:red;'>Connection error: " + err.message + "</p>";
      });
  </script>
</body>
</html>
